name: CI Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v

  cpp-build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Modern C++23 Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 cmake

      - name: Compile BCI Edge Engine with C++23
        run: |
          g++-13 -std=c++23 -O3 -Wall -Wextra cpp_inference/bci_edge_engine.cpp -o bci_benchmark
          ./bci_benchmark
